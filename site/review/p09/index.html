<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然科 S3-P09｜20 組圖文題閉環</title><style>body{background:#f4f6f9;color:#273b49;margin:0;font:15px/1.6 system-ui,"Noto Sans TC",sans-serif}main{max-width:1060px;margin:28px auto;background:#fff;border-radius:12px;padding:24px}h1{font-size:1.55rem}.intro{border-left:4px solid #af8b29;background:#fff9e9;padding:12px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.cols>div{border:1px solid #dbe4eb;padding:11px;border-radius:8px}.cols b{display:block;font-size:1.8rem}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border-bottom:1px solid #e1e7eb;padding:7px;vertical-align:top;text-align:left}th{background:#f1f5f8}.tag{font-weight:600;color:#176146}a{color:#126681}@media(max-width:640px){main{margin:0;border-radius:0}table{font-size:.72rem}th,td{padding:4px}}</style></head><body><main><p><a href="../">← S3 進度首頁</a></p><h1>S3-P09｜剩餘 11 組完成科學及雙欄驗收</h1><p class="intro">本頁是重建／改編題組的驗證清冊，不代表取得原校教師標準答案。圖片採獨立 SVG 繪製，閱讀材料重新撰寫；一題電路作圖只能人工評分。原始 187 KP 未修改。</p><div class="cols" id="stats"></div><h2>20 組題組完整清冊</h2><table><thead><tr><th>題組</th><th>小題數</th><th>重建形式</th><th>結果</th></tr></thead><tbody id="groups"></tbody></table><p id="status" role="status"></p><p><a href="../../exam/">前往自然科考古題組卷網站</a></p></main><script type="module">try{const response=await fetch("../../data/question-bank/s3-p09-status.json",{cache:"no-store"});if(!response.ok)throw Error("無法取得 P09 清冊");const x=await response.json();if(x.schema_version!=="SCIENCE_EXAM_S3_P09_CLOSEOUT_V1")throw Error("P09 契約不符");for(const [title,value] of [["已內建是非題",x.public_tf_items],["可使用情境組數",x.public_group_count],["P09 新增情境小題",x.p09_recovered_answer_slots],["累計可組卷小題",x.total_public_answer_slots],["人工評分題組",x.manually_scored_drawing_groups]]){const box=document.createElement("div"),cap=document.createElement("span"),n=document.createElement("b");cap.textContent=title;n.textContent=value;box.append(cap,n);document.querySelector("#stats").append(box);}for(const g of x.groups){const row=document.createElement("tr");const type=g.reconstruction_type==="INDEPENDENT_VECTOR_DIAGRAM"?"SVG 圖形重繪":g.reconstruction_type==="INDEPENDENT_VECTOR_WITH_MANUAL_RUBRIC"?"SVG 作圖＋人工評分":g.reconstruction_type==="PARAPHRASED_EDUCATIONAL_READING"?"獨立改寫閱讀":"文字、表格或選項重建";for(const value of [g.name,g.answer_slots,type,"已內建"]){const td=document.createElement("td");td.textContent=String(value);if(value==="已內建")td.className="tag";row.append(td);}document.querySelector("#groups").append(row);}document.querySelector("#status").textContent="公開原卷圖片裁切數："+x.source_cropped_figures_copied+"；學校原答案表已核實數："+x.teacher_key_verified_count+"。";}catch(e){document.querySelector("#status").textContent=String(e);}</script></body></html>
