name: Science Exam S1 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run governance:build
      - run: npm run governance:check
      - run: npm run governance:r1:build
      - run: npm run governance:r1:check
      - run: npm run p12:preflight:build
      - run: npm run p12:preflight:check
      - run: npm run p12:master:build
      - run: npm run p12:master:check
      - run: npm test
      - name: Build internal 187-KP by 1623-source corpus index
        run: npm run kp:index:build
      - name: Verify deterministic internal all-KP index
        run: npm run kp:index:check
      - name: Upload nonpublic 114 all-KP source index
        uses: actions/upload-artifact@v4
        with:
          name: p12-all-kp-114-source-index-v1
          path: data/index/p12-all-kp-114-source-index-v1.json
          if-no-files-found: error
      - name: Build full 46-KP by 1623-source retrieval pilot
        run: npm run kp:g04s2:pilot:build
      - name: Verify deterministic G04-S2 pilot
        run: npm run kp:g04s2:pilot:check
      - name: Upload nonpublic cross-semester KP pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: p12-g04s2-114-cross-scope-retrieval-pilot-v1
          path: data/index/p12-g04s2-114-cross-scope-retrieval-pilot-v1.json
          if-no-files-found: error
      - name: Generate nonpublic G04S2 V2 evidence-audited KP rerouting
        run: npm run kp:g04s2:v2:build
      - name: Verify source-exact V2 retrieval and rerouting parity
        run: npm run kp:g04s2:v2:check
      - name: Upload V2 exact-source semantic repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: p12-g04s2-v2-exact-source-routing-v1
          path: data/index/p12-g04s2-v2-exact-source-retrieval-routing-v1.json
          if-no-files-found: error
      - name: Build full 25-PDF 1623-slot source readiness and unseen benchmark
        run: npm run kp:g04s2:v3:build
      - name: Verify V3 immutable source and blind benchmark readback
        run: npm run kp:g04s2:v3:check
      - name: Upload nonpublic V3 source-evidence and untouched-pair test
        uses: actions/upload-artifact@v4
        with:
          name: p12-all-kp-v3-source-readiness-heldout-v1
          path: data/index/p12-all-kp-v3-fullsource-readiness-and-frozen-benchmark-v1.json
          if-no-files-found: error
      - name: Verify V3R1 original 25-PDF recovered source-slot coverage and no public changes
        run: npm run kp:v3r1:coverage:check
      - name: Upload P11 provenance and coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-p11-ci-governance
          path: |
            site/data/governance/p11-*.json
            site/data/governance/p11r1-*.json
            site/data/governance/p12-*.json
            site/data/governance/p12-*.csv
          if-no-files-found: error
