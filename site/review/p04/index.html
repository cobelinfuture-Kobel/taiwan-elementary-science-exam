<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3-P04 核准結果</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#f3f6fa;color:#243444;margin:0}main{max-width:900px;margin:24px auto;background:white;border-radius:12px;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid>div{background:#f1f5f8;padding:17px;border-radius:8px}.grid strong{display:block;font-size:1.8rem}a{color:#12657d}.note{border-left:4px solid #b99325;padding:12px;background:#fff6df}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><main><p><a href="../">返回 S3 進度</a></p><h1>S3-P04｜操作者核准與最近 KP 接受</h1><div class="grid"><div>科學建議答案核准<strong id="a">—</strong></div><div>最近 KP 映射核准<strong id="k">—</strong></div><div>受影響不同題目<strong id="u">—</strong></div></div><p class="note">7 題答案採科學論證，不代表原校教師答案表；其中有條件性判斷的題目在答案頁保留前提。最近 KP 不宣稱精確命中。187 KP Authority 未修改。</p><p>直接開啟 <a href="../../exam/">Exam 考古題組卷</a>，已核准的歷屆試題內建於公開網站，無須下載 JSON、切換題庫或另行上傳。</p><p id="status"></p></main><script type="module">try{const r=await fetch("../../data/question-bank/s3-p04-operator-acceptance-status.json");if(!r.ok)throw Error("讀取失敗");const s=await r.json();if(s.schema_version!=="SCIENCE_EXAM_S3_P04_OPERATOR_APPROVAL_V1")throw Error("資料版本不相容");document.querySelector("#a").textContent=s.answers_science_operator_accepted;document.querySelector("#k").textContent=s.nearest_kp_operator_accepted;document.querySelector("#u").textContent=s.unique_candidates_affected;document.querySelector("#status").textContent="已核准 7 題直接內建網站。其餘候選將在驗證後逐步加入，同一個組卷入口。";}catch(e){document.querySelector("#status").textContent=e.message;}</script></body></html>
