<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然科 P11｜來源與 KP 覆蓋治理</title><style>body{margin:0;background:#f4f6f9;color:#243746;font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}main{max-width:1160px;margin:24px auto;background:white;padding:26px;border-radius:12px}h1{font-size:1.5rem}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metrics article{padding:15px;border:1px solid #e1e7eb;border-radius:8px}.metrics b{display:block;font-size:2rem}.warning{padding:12px;border-left:4px solid #c39b32;background:#fff8e6}table{width:100%;border-collapse:collapse;font-size:.88rem;margin:14px 0}td,th{padding:8px;border-bottom:1px solid #e4e8eb;text-align:left;vertical-align:top}th{background:#f4f7f9}.muted{color:#586977}a{color:#126e87}@media(max-width:680px){main{margin:0;border-radius:0;padding:14px}table{font-size:.75rem}td,th{padding:5px}}</style></head><body><main><p><a href="../">← S3 認證總覽</a></p><h1>P11｜逐題身分、全卷清冊與 KP 覆蓋</h1><p class="warning">注意：477 是原卷作答位置的初步盤點分母，不是 477 題已認證。圖文改編子題目前只可靠連至來源大題／章節，尚未完成每個原始小題的精確對位；三下期中有計分與空格數不一致的待核項目。</p><div class="metrics" id="metrics"></div><h2>各單元主要 KP 覆蓋</h2><table><thead><tr><th>範圍</th><th>單元</th><th>作答欄位</th><th>已覆蓋 KP</th><th>未覆蓋 KP</th></tr></thead><tbody id="units"></tbody></table><h2>8 份原卷來源盤點</h2><table><thead><tr><th>來源 ID</th><th>PDF 頁數</th><th>盤點作答位置</th><th>狀態</th></tr></thead><tbody id="sources"></tbody></table><p class="muted" id="status" role="status">正在讀取治理報表……</p><p><a href="../../exam/">返回自然科 Exam 考卷網站</a></p></main><script type="module">
try{
 const paths=["../../data/governance/p11-question-identities.json","../../data/governance/p11-full-corpus-ledger.json","../../data/governance/p11-kp-coverage.json","../../data/governance/p11-source-sections.json"];
 const rs=await Promise.all(paths.map(p=>fetch(p,{cache:"no-cache"})));
 if(rs.some(r=>!r.ok))throw Error("治理產物尚未部署或載入失敗");
 const [ids,corpus,cov,source]=await Promise.all(rs.map(r=>r.json()));
 if(ids.schema_version!=="SCIENCE_EXAM_P11_QUESTION_IDENTITIES_V1"||corpus.schema_version!=="SCIENCE_EXAM_P11_FULL_CORPUS_SLOT_LEDGER_V1"||cov.schema_version!=="SCIENCE_EXAM_P11_KP_COVERAGE_V1")throw Error("P11 報表版本不相容");
 for(const [label,value]of [["來源考卷",corpus.source_papers],["初步原卷作答位置",corpus.original_source_slot_inventory_count],["正式網站小題",ids.questions.length],["主要 KP 已覆蓋",cov.primary_kp_covered],["主要 KP 待補",cov.primary_kp_missing]]){const a=document.createElement("article"),c=document.createElement("span"),b=document.createElement("b");c.textContent=label;b.textContent=value;a.append(c,b);document.querySelector("#metrics").append(a);}
 for(const u of cov.units){const tr=document.createElement("tr");for(const x of [u.unit_id,u.unit_title,u.published_answer_slots,u.primary_kp_covered+" / "+u.kp_total,u.primary_kp_missing]){const td=document.createElement("td");td.textContent=String(x);tr.append(td)}document.querySelector("#units").append(tr)}
 for(const p of source.source_papers){const tr=document.createElement("tr"),n=p.sections.reduce((a,b)=>a+b.slot_count,0);for(const x of [p.source_id,p.source_pdf_page_count,n,"完整分段；非是非題原位仍待對位"]){const td=document.createElement("td");td.textContent=String(x);tr.append(td)}document.querySelector("#sources").append(tr)}
 document.querySelector("#status").textContent="每題內容 SHA-256 與版本 SHA-256 已生成；72 題原卷是非題可精確對位，76 題改編情境須完成原卷子題比對。未變動 148 小題及 187 KP。";
}catch(e){document.querySelector("#status").textContent="報表驗證失敗："+String(e);}
</script></body></html>
