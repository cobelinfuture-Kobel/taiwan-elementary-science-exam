name: Science Exam S1 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run governance:build
      - run: npm run governance:check
      - run: npm run governance:r1:build
      - run: npm run governance:r1:check
      - run: npm run p12:preflight:build
      - run: npm run p12:preflight:check
      - run: npm run p12:master:build
      - run: npm run p12:master:check
      - run: npm test
      - name: Install headless Chromium for isolated 51-question acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: P12 51 staged-question A4 two-column pilot
        run: node tools/verify-p12-remaining51-layout.mjs
      - name: Upload P12 staged layout QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-p12-remaining51-localhost-layout
          path: artifacts/p12-remaining51-layout/
          if-no-files-found: ignore
      - name: Upload P11 provenance and coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-p11-ci-governance
          path: |
            site/data/governance/p11-*.json
            site/data/governance/p11r1-*.json
            site/data/governance/p12-*.json
            site/data/governance/p12-*.csv
          if-no-files-found: error
