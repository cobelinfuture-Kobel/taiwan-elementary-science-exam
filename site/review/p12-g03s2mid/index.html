<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P12｜三下期中原卷逐題覆核</title><style>body{background:#f3f6f9;margin:0;color:#263746;font:14px/1.55 system-ui,"Noto Sans TC",sans-serif}main{max-width:1120px;margin:25px auto;background:white;padding:24px;border-radius:11px}h1{font-size:1.5rem}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats>div{border:1px solid #dfe6ed;padding:12px;border-radius:8px;min-width:135px}.stats b{font-size:1.65rem;display:block}table{border-collapse:collapse;width:100%;font-size:.84rem}td,th{text-align:left;padding:8px;border-bottom:1px solid #e0e7ed;vertical-align:top}th{background:#eff4f8}.scroll{overflow-x:auto}.note{border-left:4px solid #b59138;padding:12px;background:#fff7e3}.hold{color:#9b5e12}.ok{color:#126847}select{padding:6px}@media(max-width:620px){main{margin:0;padding:12px}table{font-size:.73rem}}</style></head><body><main><p><a href="../master/">← 返回考卷總表</a></p><h1>113 學年度・三下期中・安和國小：原卷覆核</h1><p class="note">本頁記錄來源題的科學模型覆核與 KP 對應。51 個候選處於「已認證、待正式發布」階段，尚未放入組卷池；6 個保留歧義。原校教師答案表未核實。需要共用情境的題組不得拆開發布。</p><div class="stats" id="stats"></div><h2>原卷位置與判定</h2><label>狀態 <select id="filter"><option value="">全部</option><option value="CERTIFIED_STAGED_NOT_PUBLIC">候選通過未公開</option><option value="BLOCKED_FOR_HUMAN_OR_SOURCE_AUTHORITY">待科學／來源複核</option></select></label><div class="scroll"><table><thead><tr><th>來源位置</th><th>原卷概念／題意</th><th>建議答案</th><th>主要 KP</th><th>認證狀態與理由</th></tr></thead><tbody id="items"></tbody></table></div><p><a href="../../data/governance/p12-g03s2mid-candidate-review.json">下載逐題覆核證據 JSON</a>　<a href="../../data/governance/p12-master-progress.csv">最新總表 CSV</a></p><p role="status" id="status"></p></main><script type="module">
const $=id=>document.getElementById(id);
try{
 const r=await fetch("../../data/governance/p12-g03s2mid-candidate-review.json",{cache:"no-store"});if(!r.ok)throw Error("證據尚未部署");
 const d=await r.json();if(d.schema_version!=="SCIENCE_EXAM_P12_G03S2MID_FULLPAPER_CANDIDATE_REVIEW_V1")throw Error("版本不符");
 for(const [k,v] of [["待審來源位置",d.candidate_positions_total],["候選認證",d.decisions.staged],["保留疑義",d.decisions.blocked],["已原卷入庫 O/X",d.source_positions_previously_published_tf]]){const div=document.createElement("div"),span=document.createElement("span"),num=document.createElement("b");span.textContent=k;num.textContent=v;div.append(span,num);$("stats").append(div)}
 const render=()=>{$("items").replaceChildren();const shown=d.items.filter(x=>!$("filter").value||x.decision===$("filter").value);
 for(const row of shown){const tr=document.createElement("tr");for(const value of [row.source_slot_id,row.item_anchor_summary,row.model_proposed_answer??"待釐清",row.canonical_kp_id,row.decision==="CERTIFIED_STAGED_NOT_PUBLIC"?"候選通過（未公開）："+row.independently_reasoned_science_note:"保留待審："+row.issue_type+"；"+row.independently_reasoned_science_note]){const td=document.createElement("td");td.textContent=value;tr.append(td)}tr.lastChild.className=row.issue_type?"hold":"ok";$("items").append(tr)}$("status").textContent="顯示 "+shown.length+"/"+d.items.length+" 個原卷位置。";};
 $("filter").addEventListener("change",render);render();
}catch(e){$("status").textContent="資料讀取失敗："+String(e);}
</script></body></html>
