name: Science Exam S1 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run governance:build
      - run: npm run governance:check
      - run: npm run governance:r1:build
      - run: npm run governance:r1:check
      - run: npm test
      - name: Upload P11 provenance and coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-p11-ci-governance
          path: site/data/governance/p11-*.json
          if-no-files-found: error
