name: Deploy Science Exam GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: science-exam-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run governance:build
      - run: npm run governance:check
      - run: npm run governance:r1:build
      - run: npm run governance:r1:check
      - run: npm run p12:preflight:build
      - run: npm run p12:preflight:check
      - run: npm run p12:master:build
      - run: npm run p12:master:check
      - run: npm test
      - name: Install Chromium for actual A4 two-column verification
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Upload P11 governance ledgers, hashes and KP coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-p11-governance
          path: |
            site/data/governance/p11-*.json
            site/data/governance/p11r1-*.json
            site/data/governance/p12-*.json
            site/data/governance/p12-*.csv
          if-no-files-found: error
      - name: Verify two-column atomic groups and proportional images
        run: node tools/verify-exam-layout.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-s1-browser-layout
          path: artifacts/browser-layout/
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run governance:build
      - run: npm run governance:check
      - run: npm run governance:r1:build
      - run: npm run governance:r1:check
      - run: npm run p12:preflight:build
      - run: npm run p12:preflight:check
      - run: npm run p12:master:build
      - run: npm run p12:master:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify ACTUAL GitHub Pages Exam loads pinned OX assets
        run: node tools/verify-deployed-exam.mjs
      - name: Upload deployed browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-live-pages-verification
          path: artifacts/deployed-browser/
          if-no-files-found: ignore
