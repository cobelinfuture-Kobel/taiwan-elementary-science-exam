<body><main class="shell">
<header class="hero"><p class="eyebrow">TAIWAN ELEMENTARY SCIENCE EXAM · S1</p><h1>自然科學校考券模板</h1><p>沿用數學 Exam 的組卷選項與 A4 雙欄列印概念；閱讀、實驗與圖片題組須在同一欄內完整排版，圖片等比例縮至欄寬。</p><p class="warning">內建歷屆考古題依來源、KP、答案及使用者核准逐題驗證；本次另加入六題三下期中修訂版。</p><a href="../">返回首頁</a>　<a href="../review/">查看 S3 來源與入庫狀態</a></header>

</section><section class="preview"><h2>考券預覽</h2><p class="minor" id="meta">尚未產生</p><div id="sheet"></div></section></div>
</main>
<script type="module">

const $=id=>document.getElementById(id),ui={grade:$('grade'),sem:$('semester'),unit:$('unit'),mode:$('mode'),kp:$('kp'),kpWrap:$('kp-wrap'),kpSummary:$('kp-summary'),crossWrap:$('cross-wrap'),cross:$('cross'),crossKPs:$('cross-kps'),count:$('count'),order:$('order'),seed:$('seed'),sheet:$('sheet'),status:$('status'),print:$('print'),meta:$('meta')};
const qaFixture=(location.hostname==="127.0.0.1"||location.hostname==="localhost")&&new URLSearchParams(location.search).has("qa");
let authority=null,bank=null;
const unitKey = u => u.grade + "-S" + u.semester + "-" + u.unit_id;
function syncUnits(){
  if (!authority) throw Error("正式 KP Authority 未載入，不可使用替代單元");
  const old=ui.unit.value;
  const units=unitsFor(authority,Number(ui.grade.value),Number(ui.sem.value.slice(1)));
  ui.unit.replaceChildren();
  for (const unit of units) ui.unit.add(new Option(unit.unit_id + " " + unit.unit_title,unitKey(unit)));
  ui.unit.value=units.some(u=>unitKey(u)===old)?old:(ui.grade.value==="4"&&ui.sem.value==="S1"?"4-S1-U02":unitKey(units[0]));
  syncMode();
}
function syncMode(){
  if (!authority) throw Error("KP Authority 缺失");
  const m=ui.mode.value;
  const current=resolveUnit(authority,ui.unit.value);
  if(!current) throw Error("選擇的單元不在正式 Authority");
  const kps=current.knowledge_points;
  ui.kpWrap.hidden=false;
  ui.kp.disabled=!["single_kp","same_unit"].includes(m);
  ui.kp.multiple=m==="same_unit";
  ui.kp.size=m==="same_unit"?Math.min(9,kps.length):m==="single_unit"?Math.min(8,kps.length):1;
  ui.kp.replaceChildren();
  for(const kp of kps)ui.kp.add(new Option(kp.canonical_kp_id + "｜" + kp.title,kp.canonical_kp_id));
  if(m==="same_unit")for(const o of ui.kp.options)o.selected=true;
  ui.kpSummary.textContent=current.unit_id + "｜" + current.unit_title + "｜正式 KP " + kps.length + " 筆；原始 ID 與 canonical ID 均已核對。目前已核准題數：" + (bank?.blocks.filter(b=>b.unit===unitKey(current)).length??0) + "。";
  ui.crossWrap.hidden=m!=="cross_unit";
  ui.cross.replaceChildren();
  unitsFor(authority,Number(ui.grade.value),Number(ui.sem.value.slice(1))).forEach((unit,i)=>{
    const lab=document.createElement("label"),c=document.createElement("input");
    c.type="checkbox";c.value=unitKey(unit);c.checked=i<2;
    lab.append(c,document.createTextNode(unit.unit_id+" "+unit.unit_title+"（"+unit.knowledge_points.length+" KP）"));
    ui.cross.append(lab);

}
function renderCrossKPs(){
  ui.crossKPs.replaceChildren();
  if(ui.mode.value!=="cross_unit") return;
  for(const row of ui.cross.querySelectorAll("input:checked")){
    const unit=resolveUnit(authority,row.value);
    if(!unit)throw Error("跨單元不在正式 Authority");
    const section=document.createElement("details");
    const summary=document.createElement("summary");
    summary.textContent=unit.unit_id+" "+unit.unit_title+"（"+unit.knowledge_points.length+" KP）";
    section.append(summary);
    for(const kp of unit.knowledge_points){
      const label=document.createElement("label"),check=document.createElement("input");
      check.type="checkbox";check.checked=true;check.value=kp.canonical_kp_id;
      label.append(check,document.createTextNode(kp.title));
      section.append(label);
    }
    ui.crossKPs.append(section);
  }
}
function invalidate(){ui.print.disabled=true;ui.meta.textContent='請重新產生考卷';}
function seeded(blocks,seed){let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}let x=h>>>0||1;const a=[...blocks];for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;const j=(x>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a;}
const size=b=>b.type==='group'?b.items.length:1;
const subset=chooseExactBlocks;
function selectedPool(){const mode=ui.mode.value,uid=ui.unit.value,pre=ui.grade.value+'-'+ui.sem.value+'-',selected=[...ui.cross.querySelectorAll('input:checked')].map(x=>x.value);if(mode==='cross_unit'&&selected.length<2)throw Error('跨單元至少需選兩個單元');const kps=new Set([...ui.kp.selectedOptions].map(x=>x.value));const crossKPs=new Set([...ui.crossKPs.querySelectorAll('input:checked')].map(x=>x.value));if(mode==='same_unit'&&kps.size<2)throw Error('同單元多 KP 至少選兩個知識點');if(mode==='cross_unit')for(const sourceId of selected){const u=resolveUnit(authority,sourceId);if(!u||!u.knowledge_points.some(x=>crossKPs.has(x.canonical_kp_id)))throw Error('每個跨單元至少勾選一個知識點');}if(!bank)throw Error('內建考古題庫尚未載入');return bank.blocks.filter(b=>{if(!b.unit.startsWith(pre))return false;if(mode==='midterm')return /U0[12]$/.test(b.unit);if(mode==='final')return /U0[34]$/.test(b.unit);if(mode==='cross_unit')return selected.includes(b.unit)&&[b.canonical_kp_id,...(b.secondary_canonical_kp_ids??[])].some(x=>crossKPs.has(x));if(b.unit!==uid)return false;if(mode==='single_unit')return true;return [b.canonical_kp_id,...(b.secondary_canonical_kp_ids??[])].some(x=>kps.has(x));});}
function node(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;}
function child(parent,tag,cls,txt){const x=node(tag,cls,txt);parent.append(x);return x;}
function paper(answer){const p=node('section','paper');p.dataset.answer=answer?'true':'false';const head=child(p,'header');child(head,'h3','',($('school').value||'○○國民小學')+'　'+$('year').value+' 學年度');child(head,'div','', '自然科 '+$('exam-name').value+(answer?(qaFixture?'｜示範答案':'｜科學判答與說明'):''));child(head,'div','student','年級：_____　班級：_____　座號：_____　姓名：______________');child(head,'div','watermark',qaFixture?'DEMO_ONLY｜本機版面測試':'歷屆學校考古題｜科學判答，非原校教師答案表');if(!answer&&!qaFixture)child(head,'div','student','是非題：請在題目前的（　）內填入 O 或 X。');const body=child(p,'div','body'),foot=child(p,'footer');child(foot,'span','', 'Science Exam');const num=child(foot,'span');ui.sheet.append(p);return {p,body,num,mode:'',targets:[]};}
function layout(page,mode){page.mode=mode;const wrap=child(page.body,'div',mode==='wide'?'page-wide':'cols');page.targets=mode==='wide'?[wrap]:[child(wrap,'div','col'),child(wrap,'div','col')];}
function overflow(x){return x.scrollHeight>x.clientHeight+2||x.scrollWidth>x.clientWidth+2;}
function question(q,n){const a=node('article','question');const prefix=(q.type==='tf'||q.type==='short'||q.type==='mcq'||q.type==='multi')?'（　）'+n+'. ':n+'. ';child(a,'div','',prefix+removePrintedScoringInstructions(q.stem));if(q.options){const o=child(a,'div','opts');q.options.forEach((v,i)=>child(o,'div','',v));}return a;}
function sourceContextGroup(b,start){
 const a=node('section','group group-context');a.dataset.groupId=b.id;
 child(a,'h4','',b.title+'（'+start+'–'+(start+b.items.length-1)+' 題）');
 if(b.shared.instructions)child(a,'p','group-instructions',removePrintedScoringInstructions(b.shared.instructions));
 if(b.shared.passage)child(a,'p','group-passage',removePrintedScoringInstructions(b.shared.passage));
 if(b.shared.choiceBank?.length){
  const choices=child(a,'div','choice-bank');
  b.shared.choiceBank.forEach(item=>child(choices,'div','',item));
 }
 if(b.shared.table){
  const table=child(a,'table','');const thead=child(table,'thead'),header=child(thead,'tr');
  b.shared.table.headers.forEach(v=>child(header,'th','',v));

 }
 if(b.figure_spec)a.append(renderP12G03FinalFigure(b.figure_spec));
 if(b.diagram_kind&&b.diagram_kind!=="DRAW_CIRCUIT")a.append(renderScienceDiagram(b.diagram_kind));
 b.items.forEach((item,i)=>{
   a.append(question(item,start+i));
   if(item.type==="draw")a.append(renderScienceDiagram("DRAW_CIRCUIT"));
 });

}
function group(b,start){if(b.source==='CERTIFIED_CONTEXT_RECONSTRUCTED')return sourceContextGroup(b,start);const a=node('section','group');child(a,'h4','',b.title+'（題組，'+start+'–'+(start+b.items.length-1)+' 題）');child(a,'p','',b.passage);const fig=document.createElementNS('http://www.w3.org/2000/svg','svg');fig.classList.add('diagram');a.append(fig);fig.setAttribute('width','420');fig.setAttribute('height','110');fig.setAttribute('viewBox','0 0 420 110');fig.setAttribute('preserveAspectRatio','xMidYMid meet');fig.setAttribute('role','img');fig.setAttribute('aria-label','示範水生植物示意圖');const ns='http://www.w3.org/2000/svg';const rect=document.createElementNS(ns,'rect');rect.setAttribute('width','420');rect.setAttribute('height','110');rect.setAttribute('fill','#d2ecfa');fig.append(rect);const line=document.createElementNS(ns,'path');line.setAttribute('d','M0 46 H420 M90 90 L90 30 M240 91 L240 58');line.setAttribute('stroke','#327da9');line.setAttribute('stroke-width','4');fig.append(line);const ellipse=document.createElementNS(ns,'ellipse');ellipse.setAttribute('cx','90');ellipse.setAttribute('cy','30');ellipse.setAttribute('rx','43');ellipse.setAttribute('ry','11');ellipse.setAttribute('fill','#6eb66e');fig.append(ellipse);b.items.forEach((x,i)=>a.append(question(x,start+i)));return a;}
function generate(){ui.print.disabled=true;ui.status.dataset.error='false';ui.sheet.replaceChildren();try{const historical=!qaFixture;if(!bank||bank.admission!==(historical?'EMBEDDED_CERTIFIED_HISTORICAL':'DEMO_ONLY'))throw Error('內建考古題庫尚未完成來源驗證');const n=Number(ui.count.value);if(!Number.isInteger(n)||n<1||n>120)throw Error('題數須為 1–120');const pool=selectedPool(),total=pool.reduce((s,b)=>s+size(b),0);if(total<n)throw Error('題庫不足：可用 '+total+' 小題；不得憑空補題');const ordered=ui.order.value==='group'?[...pool].sort((a,b)=>a.type.localeCompare(b.type)):seeded(pool,ui.seed.value);const chosen=subset(ordered,n);if(!chosen)throw Error('無法恰好選出 '+n+' 小題（共用題組不可拆分，同一張卷不可重複抽取相同事實）');
let pages=[],num=0;const newPage=()=>{const p=paper(false);layout(p,'two');pages.push(p);return p;};
let current=newPage(),col=0;for(const b of chosen){const start=num+1;const el=b.type==='group'?group(b,start):question(b,num+1);const count=size(b);let mounted=false;
for(let attempt=0;attempt<3&&!mounted;attempt++){const target=current.targets[col];target.append(el);if(!overflow(target)){mounted=true;break;}target.removeChild(el);if(col+1<current.targets.length)col++;else{current=newPage();col=0;}}
if(!mounted)throw Error('題目內容過高，拒絕裁切');num+=count;}
let answers=[];let ix=0;for(const b of chosen){if(b.type==='group')for(const sub of b.items)answers.push({number:++ix,answer:sub.answer,explanation:sub.answer_explanation,qualification:sub.answer_assumption,draw:(sub.type==='draw'?b.diagram_kind:null)});else answers.push({number:++ix,answer:b.type==='tf'?(qaFixture?(b.answer==='正確'?'O':'X'):b.answer):b.answer,explanation:b.answer_explanation,qualification:b.answer_assumption});}
if($('answer-key').checked){let a=paper(true);layout(a,'two');pages.push(a);let ci=0;for(const entry of answers){const x=node('div','answer',entry.number+'. '+entry.answer);if(historical&&entry.explanation)child(x,'small','',removePrintedScoringInstructions(entry.explanation));if(historical&&entry.qualification)child(x,'small','', '判斷前提：'+removePrintedScoringInstructions(entry.qualification));if(entry.draw==='DRAW_CIRCUIT')x.append(renderScienceDiagram('DRAW_CIRCUIT',{answer:true}));let ok=false;for(let tr=0;tr<3&&!ok;tr++){a.targets[ci].append(x);if(!overflow(a.targets[ci]))ok=true;else{x.remove();if(ci===0)ci=1;else{a=paper(true);layout(a,'two');pages.push(a);ci=0;}}}if(!ok)throw Error('答案頁無法排版');}}
pages.forEach((p,i)=>p.num.textContent='第 '+(i+1)+'／'+pages.length+' 頁');ui.meta.textContent=(historical?'內建考古題 ':'示範題 ')+num+' 小題｜A4 '+pages.length+' 頁｜'+(historical?'科學判答':'DEMO_ONLY');ui.status.textContent=historical?'已從公開內建題庫組卷；答案為科學論證，不代表原校教師答案表。':'示範考卷已完成（僅限本機 QA）。';ui.print.disabled=false;
}catch(e){ui.sheet.replaceChildren();ui.status.dataset.error='true';ui.status.textContent=e.message;ui.meta.textContent='尚未產生';}}
async function init(){
 try{
  authority=await loadAuthority();
  // Render canonical curriculum selector even if historical-bank initialization fails.
  syncUnits();
  if(qaFixture){
   const r=await fetch('../data/layout-demo.json',{cache:"no-cache"});
   if(!r.ok)throw Error('QA 測試資料載入失敗');
   bank=await r.json();
   if(bank.admission!=="DEMO_ONLY")throw Error('QA 測試版本不符');
  }else{
   bank=await loadEmbeddedHistoricalBank(authority);
   assertScorelessMetadata(bank.blocks);
   document.querySelector("#bank-info").textContent="已載入內建考古題 "+bank.certifiedAnswerSlots+" 小題（"+bank.certifiedTrueFalse+" 題是非＋"+bank.certifiedStandaloneChoice+" 題單選＋"+bank.certifiedGroupCount+" 組情境）；選年級、單元或 KP 後直接產生考卷。";
  }
  syncUnits();generate();
 }catch(e){ui.status.textContent='題庫載入或版本檢查失敗：'+e.message+'。請重新整理網頁；若持續發生，請回報此訊息。';ui.status.dataset.error='true';$('generate').disabled=true;ui.print.disabled=true;ui.sheet.replaceChildren();if(!authority)ui.kpSummary.textContent='正式 KP Authority 尚未載入；已禁止組卷。';else ui.kpSummary.textContent=authority.counts.knowledge_points+' KP 選單已載入，但核准題庫版本不一致，暫停組卷。';}
}
[ui.grade,ui.sem].forEach(e=>e.addEventListener('change',syncUnits));ui.unit.addEventListener('change',syncMode);ui.mode.addEventListener('change',syncMode);
ui.cross.addEventListener('change',()=>{renderCrossKPs();invalidate();});
for(const x of [ui.kp,ui.crossKPs,ui.count,ui.order,ui.seed,$('school'),$('year'),$('exam-name'),$('answer-key')])x.addEventListener('change',invalidate);
$('generate').addEventListener('click',generate);ui.print.addEventListener('click',()=>window.print());init();
</script></body></html>
