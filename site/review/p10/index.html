<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3-P10 三下四下考古題入庫</title><style>body{margin:0;background:#f4f6f9;color:#273748;font:15px/1.6 system-ui,"Noto Sans TC",sans-serif}main{max-width:960px;margin:28px auto;border-radius:12px;background:white;padding:27px}h1{font-size:1.65rem}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.summary>div{border:1px solid #e0e8ed;border-radius:9px;padding:15px}.summary strong{display:block;font-size:1.9rem}.notice{padding:13px;background:#fff8e6;border-left:4px solid #bb9431}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:9px;text-align:left;border-bottom:1px solid #e1e6eb}th{background:#f4f6f8}a{color:#106c83}</style></head><body><main><p><a href="../">← 考古題驗收總覽</a></p><h1>自然科 S3-P10｜三、四年級下學期考古題</h1><p class="notice">本批次的答案由科學概念獨立驗證，沒有採用 PDF 文字層疑似答案作為教師標準答案。原卷其餘選擇題、閱讀題與圖片題仍須進一步處理，不代表四份考卷全部入庫。</p><div id="summary" class="summary"></div><h2>四個考試範圍與來源</h2><table><thead><tr><th>考試範圍</th><th>原卷學校</th><th>適用單元</th><th>首批 O/X</th></tr></thead><tbody id="rows"></tbody></table><p id="status" role="status"></p><p><a href="../../exam/">開啟自然科 Exam 組卷</a></p></main><script type="module">try{const r=await fetch("../../data/question-bank/s3-p10-status.json",{cache:"no-cache"});if(!r.ok)throw Error("來源清冊無法載入");const s=await r.json();if(s.schema_version!=="SCIENCE_S3_P10_FIRST_BATCH_V1")throw Error("S3-P10 清冊版本不符");const summary=[["首批來源考卷",s.source_count],["新入庫是非題",s.newly_certified_text_tf],["累計是非題",s.total_tf],["累計可組卷小題",s.new_public_answer_slots]];for(const [label,value]of summary){const a=document.createElement("div"),text=document.createElement("span"),num=document.createElement("strong");text.textContent=label;num.textContent=value;a.append(text,num);document.querySelector("#summary").append(a);}for(const g of s.sources){const tr=document.createElement("tr");const items=[(g.grade===3?"三下":"四下")+(g.period==="MIDTERM"?"期中":"期末"),g.school,g.covered_units.join("+"),String(g.certified_tf_count)];for(const value of items){const td=document.createElement("td");td.textContent=value;tr.append(td)}document.querySelector("#rows").append(tr);}document.querySelector("#status").textContent="本輪 32 題全部來自可見 PDF 第一頁，並保留來源 SHA-256；原有 187 KP 無變動。";}catch(e){document.querySelector("#status").textContent=e.message;}</script></body></html>
