<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P11R1｜原卷逐格對位</title><style>body{background:#f4f6f9;margin:0;color:#263747;font:15px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:24px auto;padding:26px;background:#fff;border-radius:12px}h1{font-size:1.55rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stats>div{border:1px solid #dce4eb;border-radius:8px;padding:14px}.stats b{display:block;font-size:1.9rem}table{width:100%;border-collapse:collapse;font-size:.87rem}td,th{padding:7px;border-bottom:1px solid #e0e5e9;text-align:left}th{background:#f2f5f7}.notice{background:#fff8e6;border-left:4px solid #bb8e31;padding:11px}a{color:#126980}@media(max-width:650px){main{margin:0;padding:14px}table{font-size:.73rem}}</style></head><body><main><p><a href="../p11/">← P11 主要治理報表</a></p><h1>P11R1｜原卷位置對位與配分核對</h1><p class="notice">「逐格對位」指原始考卷的位置可追溯，並不表示改編的題幹、示意圖與原卷逐字相同，也不代表原校教師答案已核實。本輪不修改 148 道公開作答小題。剩餘原卷候選題必須個別進行答案及 KP 認證。</p><div class="stats" id="metrics"></div><h2>8 份考卷位置分配</h2><table><thead><tr><th>來源</th><th>來源位置</th><th>原卷 O/X</th><th>改編題已對位</th><th>待逐題認證</th></tr></thead><tbody id="sources"></tbody></table><h2>20 組改編情境的來源關聯</h2><table><thead><tr><th>題組 ID</th><th>原卷頁碼</th><th>已對位小題</th><th>原圖是否照搬</th></tr></thead><tbody id="groups"></tbody></table><p id="score"></p><p id="gate"></p><p role="status" id="status"></p><p><a href="../../exam/">回到自然科 Exam</a></p></main><script type="module">try{
const r=await fetch("../../data/governance/p11r1-reconciled-ledger.json",{cache:"no-cache"});if(!r.ok)throw Error("R1 報表無法載入");const x=await r.json();if(x.schema_version!=="SCIENCE_EXAM_P11R1_SOURCE_SLOT_RECONCILIATION_V1")throw Error("R1 版本不符");
for(const [k,n]of [["原卷暫列作答位置",x.original_source_answer_positions],["原卷 O/X 精確對位",x.baseline_original_TF_source_links],["改編題子題已對位",x.adapted_published_subitems_with_verified_original_source_anchors],["待逐題認證位置",x.original_source_answer_positions_remaining_for_candidate_review],["公開網站小題",x.baseline_public_answer_slots]]){let a=document.createElement("div"),b=document.createElement("b"),s=document.createElement("span");s.textContent=k;b.textContent=n;a.append(s,b);document.querySelector("#metrics").append(a);}
for(const p of x.per_source_summary){let tr=document.createElement("tr");for(const item of [p.source_id,p.original_source_answer_positions,p.published_original_TF,p.source_positions_linked_to_adapted_context,p.remaining_candidate_positions]){let t=document.createElement("td");t.textContent=item;tr.append(t)}document.querySelector("#sources").append(tr);}
const grouped=new Map();for(const q of x.published_adapted_source_links){const old=grouped.get(q.published_item_id.split("#")[0])??{page:q.original_pdf_page,items:0};old.items++;grouped.set(q.published_item_id.split("#")[0],old);}for(const [name,g]of grouped){const tr=document.createElement("tr");for(const value of [name,g.page,g.items,"否（獨立改編）"]){const td=document.createElement("td");td.textContent=value;tr.append(td)}document.querySelector("#groups").append(tr);}
const s=x.water_state_printed_scoring_reconciliation;document.querySelector("#score").textContent="三下期中水形態題："+s.score_question_count+" 個印刷計分小題／"+s.actual_blanks+" 個作答空格。前兩題各含兩格，未推定部分給分方式。";
document.querySelector("#gate").textContent="P12 來源候選逐題篩選："+(x.admission_gate.controlled_p12_candidate_screening_enabled?"允許":"暫停")+"；未逐題驗證者直接公開：禁止。";
document.querySelector("#status").textContent="已記錄 "+x.published_adapted_source_links.length+" 個改編小題與 "+x.original_source_answer_positions_linked_to_76_adapted_subitems+" 個來源位置；修正頁碼定位 "+x.page_metadata_corrections.length+" 處。";
}catch(e){document.querySelector("#status").textContent="R1 驗收資料錯誤："+String(e)}</script></body></html>
